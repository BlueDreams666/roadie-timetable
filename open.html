<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Roadie</title>
<style>
  :root { --bg:#0b0f0d; --card:#1b211e; --text:#f2f5f3; --muted:#9aa5a0; --amber:#f2bd2c; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, system-ui, "Segoe UI", Arial, sans-serif; background:var(--bg); color:var(--text); }
  main { max-width: 520px; margin: 0 auto; padding: 16px; }
  .card { background:var(--card); border-radius:18px; padding:18px; margin-bottom:12px; }
  h1 { font-size:24px; margin:4px 0 6px; }
  .muted { color:var(--muted); font-size:15px; }
  a.button { display:block; text-align:center; background:var(--amber); color:#1a1a1a; font-weight:800; font-size:18px;
             border-radius:14px; padding:14px; text-decoration:none; margin-top:14px; }
  iframe { width:100%; height:260px; border:0; border-radius:14px; background:#222; margin-top:12px; }
  footer { color:var(--muted); font-size:12px; text-align:center; margin-top:8px; }
</style>
</head>
<body>
<main>
  <div class="card">
    <div class="muted" id="kind"></div>
    <h1 id="title">Roadie</h1>
    <div class="muted" id="detail"></div>
    <a class="button" id="open" href="#"></a>
    <iframe id="map" title="map" hidden></iframe>
  </div>
  <footer id="foot"></footer>
</main>
<script>
// A stop or line shared from Roadie: ?stop=<code>&name=…&lat=…&lon=… or ?line=<route_id>&name=…
// The button opens it in Roadie when Roadie is installed. Nothing is sent anywhere by this page.
// fr, am, uk and es are machine-made and wait for a native speaker, as in the app.
const T = {
  he: { stop: "תחנה", line: "קו", open: "פתיחה ב־Roadie", foot: "נשלח מ־Roadie. אם Roadie מותקן, הכפתור פותח את העמוד באפליקציה." },
  ar: { stop: "محطة", line: "خط", open: "افتح في Roadie", foot: "أُرسل من Roadie. إذا كان Roadie مثبّتًا، يفتح الزر الصفحة في التطبيق." },
  ru: { stop: "Остановка", line: "Маршрут", open: "Открыть в Roadie", foot: "Отправлено из Roadie. Если Roadie установлен, кнопка откроет страницу в приложении." },
  en: { stop: "Stop", line: "Line", open: "Open in Roadie", foot: "Shared from Roadie. If Roadie is installed, the button opens this in the app." },
  fr: { stop: "Arrêt", line: "Ligne", open: "Ouvrir dans Roadie", foot: "Partagé depuis Roadie. Si Roadie est installé, le bouton l'ouvre dans l'app." },
  es: { stop: "Parada", line: "Línea", open: "Abrir en Roadie", foot: "Compartido desde Roadie. Si Roadie está instalado, el botón lo abre en la app." },
  uk: { stop: "Зупинка", line: "Лінія", open: "Відкрити в Roadie", foot: "Надіслано з Roadie. Якщо Roadie встановлено, кнопка відкриє це в застосунку." },
  am: { stop: "ፌርማታ", line: "መስመር", open: "በRoadie ክፈት", foot: "ከRoadie የተጋራ። Roadie ከተጫነ አዝራሩ በመተግበሪያው ውስጥ ይከፍተዋል።" },
};
// ?hl=he picks the language by hand (to check a layout); otherwise the browser's.
const lang = (new URLSearchParams(location.search).get("hl") || navigator.language || "en").slice(0, 2);
const t = T[lang] || T.en;
document.documentElement.lang = T[lang] ? lang : "en";
document.documentElement.dir = ["he", "ar"].includes(lang) ? "rtl" : "ltr";
const q = new URLSearchParams(location.search);
const stop = q.get("stop"), line = q.get("line"), name = q.get("name") || "";
// Shown with textContent, so nothing here can become markup; only control characters go, and the length is capped.
// (The old letters-and-digits filter dropped the Hebrew marks ״ ׳ and the arrow: "ד״ר" showed as "דר".)
const safe = s => String(s).replace(/[\u0000-\u001f\u007f]/g, "").slice(0, 120);
// Roadie names a shared line "Line 5 to …" in the sender's language; the word "Line" above it only for older links.
const named = line && /^\S+ \d/.test(name) && !/^\d/.test(name);
document.getElementById("kind").textContent = stop ? `${t.stop} ${safe(stop)}` : line && !named ? t.line : "";
document.getElementById("title").textContent = safe(name) || "Roadie";
const app = stop ? `roadie://stop/${encodeURIComponent(stop)}` : line ? `roadie://line/${encodeURIComponent(line)}` : "roadie://home";
const open = document.getElementById("open");
open.href = app;
open.textContent = t.open;
const lat = parseFloat(q.get("lat")), lon = parseFloat(q.get("lon"));
if (isFinite(lat) && isFinite(lon)) {
  const m = document.getElementById("map");
  const d = 0.004;
  m.src = `https://www.openstreetmap.org/export/embed.html?bbox=${lon - d},${lat - d},${lon + d},${lat + d}&marker=${lat},${lon}`;
  m.hidden = false;
}
document.getElementById("foot").textContent = t.foot;
</script>
</body>
</html>
